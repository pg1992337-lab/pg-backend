<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG Voice Assistant</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .status-card {
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            width: 350px;
        }
        .mic-btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        .mic-btn:hover { background-color: #2ea043; }
        #status { margin-top: 15px; font-size: 16px; color: #58a6ff; }
        #output { margin-top: 10px; font-size: 14px; color: #8b949e; }
        #errorLog { margin-top: 15px; font-size: 13px; color: #f85149; word-break: break-all; }
    </style>
</head>
<body>

<div class="status-card">
    <h2>PG AI Assistant</h2>
    <button class="mic-btn" id="startBtn" onclick="startAssistant()">Start PG</button>
    <p id="status">স্টার্ট বাটনে চাপ দিয়ে শুরু কর</p>
    <p id="output"></p>
    <p id="errorLog"></p>
</div>

<script>
    const BACKEND_URL = "https://pg-backend-gpzj.onrender.com/chat";
    let recognition;

    function startAssistant() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            document.getElementById('errorLog').innerText = "ত্রুটি: আপনার ব্রাউজারে Voice Recognition সাপোর্ট করছে না। Chrome ব্রাউজার ব্যবহার করুন।";
            return;
        }

        try {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'bn-IN';
            recognition.interimResults = false;

            recognition.onstart = () => {
                document.getElementById('status').innerText = "PG শুনছে... বলুন!";
                document.getElementById('errorLog').innerText = "";
            };

            recognition.onresult = async (event) => {
                const userText = event.results[0][0].transcript;
                document.getElementById('output').innerText = "আপনি: " + userText;
                document.getElementById('status').innerText = "PG ভাবছে...";
                await sendToBackend(userText);
            };

            recognition.onerror = (event) => {
                document.getElementById('errorLog').innerText = "Mic Error: " + event.error;
            };

            recognition.onend = () => {
                document.getElementById('status').innerText = "বন্ধ হয়েছে। আবার চেষ্টা করতে বাটনে চাপুন।";
            };

            recognition.start();

        } catch (err) {
            document.getElementById('errorLog').innerText = "Error: " + err.message;
        }
    }

    async function sendToBackend(text) {
        try {
            const response = await fetch(BACKEND_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text })
            });

            if (!response.ok) {
                throw new Error("HTTP Error Status: " + response.status);
            }

            const data = await response.json();
            const replyText = data.speech_response || data.response || "কোনো উত্তর পাওয়া যায়নি";
            document.getElementById('status').innerText = "PG বলছে...";
            speakResponse(replyText);

        } catch (error) {
            document.getElementById('errorLog').innerText = "Backend Error: " + error.message;
        }
    }

    function speakResponse(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'bn-IN';
        utterance.onend = () => {
            if (recognition) recognition.start();
        };
        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
