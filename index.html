<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG AI Assistant</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 380px;
            width: 90%;
        }
        button {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin: 10px 5px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #16a34a;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            margin-bottom: 10px;
            outline: none;
        }
        .status {
            color: #38bdf8;
            font-size: 16px;
            margin-top: 15px;
            min-height: 30px;
            word-wrap: break-word;
        }
        .user-text {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>PG AI Assistant</h2>
    
    <input type="text" id="textInput" placeholder="এখানে লিখে পাঠান..." />
    <br>
    <button onclick="sendTextMessage()">পাঠান</button>
    <button id="startBtn" onclick="toggleSpeech()">🎤 কথা বলুন</button>

    <div id="status" class="status">প্রস্তুত...</div>
    <div id="userText" class="user-text"></div>
</div>

<script>
    const BACKEND_URL = "https://pg-backend-gpzj.onrender.com/chat";
    let recognition;
    let isListening = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'bn-BD';
        recognition.continuous = false;

        recognition.onstart = function() {
            isListening = true;
            document.getElementById("status").innerText = "শুনছি...";
            document.getElementById("startBtn").innerText = "⏹️ থামুন";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            processMessage(transcript);
        };

        recognition.onerror = function(event) {
            document.getElementById("status").innerText = "মাইক্রোফোনে সমস্যা হয়েছে। টাইপ করে চেষ্টা করুন।";
            resetBtn();
        };

        recognition.onend = function() {
            resetBtn();
        };
    }

    function toggleSpeech() {
        if (!recognition) {
            alert("আপনার ব্রাউজারে ভয়েস সাপোর্ট নেই। Chrome বা Edge ব্যবহার করুন।");
            return;
        }
        if (!isListening) {
            recognition.start();
        } else {
            recognition.stop();
        }
    }

    function resetBtn() {
        isListening = false;
        document.getElementById("startBtn").innerText = "🎤 কথা বলুন";
    }

    function sendTextMessage() {
        const inputField = document.getElementById("textInput");
        const message = inputField.value.trim();
        if (message !== "") {
            processMessage(message);
            inputField.value = "";
        }
    }

    async function processMessage(message) {
        document.getElementById("userText").innerText = "আপনি: " + message;
        document.getElementById("status").innerText = "চিন্তা করছি...";

        try {
            const response = await fetch(BACKEND_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
            const reply = data.speech_response || "কোনো উত্তর পাওয়া যায়নি।";
            
            document.getElementById("status").innerText = "PG: " + reply;
            speakText(reply);

        } catch (err) {
            console.error(err);
            document.getElementById("status").innerText = "সার্ভার এরর! আবার চেষ্টা করুন।";
        }
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'bn-BD';
            window.speechSynthesis.speak(utterance);
        }
    }
</script>

</body>
</html>
