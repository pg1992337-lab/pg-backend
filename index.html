<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG AI Assistant</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 350px;
            width: 90%;
        }
        button {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin: 15px 0;
            transition: 0.3s;
        }
        button:hover {
            background-color: #16a34a;
        }
        .status {
            color: #38bdf8;
            font-size: 16px;
            margin-top: 10px;
            min-height: 24px;
        }
        .user-text {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>PG AI Assistant</h2>
    <button id="startBtn" onclick="toggleSpeech()">Start PG</button>
    <div id="status" class="status">শুনতে প্রস্তুত...</div>
    <div id="userText" class="user-text"></div>
</div>

<script>
    const BACKEND_URL = "https://pg-backend-gpzj.onrender.com/chat";
    let recognition;
    let isListening = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'bn-BD'; // বাংলা ইনপুট
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = function() {
            isListening = true;
            document.getElementById("status").innerText = "শুনছি...";
            document.getElementById("startBtn").innerText = "Stop PG";
        };

        recognition.onresult = async function(event) {
            const transcript = event.results[0][0].transcript;
            document.getElementById("userText").innerText = "আপনি: " + transcript;
            document.getElementById("status").innerText = "চিন্তা করছি...";

            try {
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: transcript })
                });

                const data = await response.json();
                const reply = data.speech_response || "কোনো উত্তর পাওয়া যায়নি।";
                
                document.getElementById("status").innerText = "PG: " + reply;
                speakText(reply);

            } catch (err) {
                console.error(err);
                document.getElementById("status").innerText = "সার্ভার এরর! আবার চেষ্টা করুন।";
            }
        };

        recognition.onerror = function(event) {
            console.error(event.error);
            document.getElementById("status").innerText = "শুনতে সমস্যা হয়েছে। আবার চাপুন।";
            resetBtn();
        };

        recognition.onend = function() {
            resetBtn();
        };

    } else {
        alert("আপনার ব্রাউজারে ভয়েস সাপোর্ট নেই। Chrome বা Edge ব্যবহার করুন।");
    }

    function toggleSpeech() {
        if (!isListening) {
            recognition.start();
        } else {
            recognition.stop();
        }
    }

    function resetBtn() {
        isListening = false;
        document.getElementById("startBtn").innerText = "Start PG";
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'bn-BD';
            window.speechSynthesis.speak(utterance);
        }
    }
</script>

</body>
</html>
